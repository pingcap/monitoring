name: Build security regression checks

on:
  pull_request:
    paths:
      - '.github/workflows/build-security.yaml'
      - '.github/workflows/reloader-dockerhub.yaml'
      - 'pkg/common/**'
      - 'pkg/ansible/**'
      - 'pkg/operator/**'
      - 'cmd/**'
      - 'monitor-snapshot/release-8.5/operator/rules/**'
      - 'scripts/**'
      - 'reload/**'
      - 'go.mod'
      - 'go.sum'
      - 'dependencies.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./pkg/common
      - run: go test -race ./pkg/ansible
      - run: go test -race ./pkg/operator
      - run: go test ./cmd/main.go ./cmd/rules_test.go ./cmd/file_modes_unix_test.go
      - run: go test ./cmd/monitoring.go ./cmd/auth_test.go ./cmd/dm_rules_test.go ./cmd/rule_errors_test.go
      - run: python3 -m unittest discover -s scripts -p 'test_build_security.py' -v
      - run: docker build -f reload/Dockerfile_buildx -t monitoring-reloader:backport-check .
