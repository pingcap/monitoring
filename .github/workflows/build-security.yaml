name: Build security regression checks

on:
  pull_request:
    paths:
      - '.github/workflows/build-security.yaml'
      - '.github/workflows/reloader-dockerhub.yaml'
      - 'pkg/common/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'dependencies.yaml'
      - 'reload/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./pkg/common
      - run: python3 -m unittest discover -s scripts -p 'test_build_security.py' -v

  reloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./reload/...
      - run: go vet ./reload/...
      - run: CGO_ENABLED=0 go build -o /tmp/reloader ./reload
